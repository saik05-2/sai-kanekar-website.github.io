<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sai Kanekar Portfolio</title>

<style>

/* RESET */
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: Arial, sans-serif;
}

body {
  background: #050507;
  color: white;
  overflow-x: hidden;
}

/* GLOBAL */
section {
  padding: 100px 80px;
}

h2 {
  font-size: 40px;
  margin-bottom: 20px;
}

/* HERO */
.hero {
  display: flex;
  align-items: center;
  justify-content: space-between;
  height: 100vh;
  padding: 0 80px;
  position: relative;
  perspective: 1000px;
}

.hero-left {
  max-width: 400px;
  animation: slideLeft 1s ease forwards;
}

.hero-left h1 {
  font-size: 64px;
}

.desc {
  margin: 20px 0;
  color: #aaa;
}

.buttons {
  display: flex;
  gap: 10px;
}

button {
  padding: 10px 20px;
  border-radius: 20px;
  border: none;
  cursor: pointer;
}

.primary { background: #7c5cff; color: white; }
.secondary { background: transparent; border: 1px solid #555; color: white; }

.hero-center {
  position: relative;
}

.hero-img {
  height: 85vh;
  z-index: 2;
  position: relative;
  animation: riseUp 1s ease forwards;
}

.glow {
  position: absolute;
  width: 500px;
  height: 500px;
  background: radial-gradient(circle, #7c5cff, transparent);
  filter: blur(80px);
  z-index: 1;
}

.hero-right {
  text-align: right;
}

.outline {
  font-size: 64px;
  color: transparent;
  -webkit-text-stroke: 1px #7c5cff;
}

.filled {
  font-size: 64px;
  font-weight: bold;
}

/* ABOUT */
.about p {
  max-width: 600px;
  color: #bbb;
}

/* SKILLS */
.skills-grid {
  display: flex;
  gap: 20px;
  flex-wrap: wrap;
}

.skill {
  padding: 20px;
  border: 1px solid #333;
  border-radius: 10px;
  min-width: 120px;
  text-align: center;
}

/* PROJECTS */
.projects-grid {
  display: flex;
  gap: 20px;
  flex-wrap: wrap;
}

.project {
  flex: 1;
  min-width: 250px;
  padding: 20px;
  border: 1px solid #333;
  border-radius: 10px;
}

/* CONTACT */
.contact form {
  display: flex;
  flex-direction: column;
  gap: 15px;
  max-width: 400px;
}

input, textarea {
  padding: 10px;
  background: #111;
  border: 1px solid #333;
  color: white;
}

/* ANIMATIONS */
@keyframes slideLeft {
  from { opacity: 0; transform: translateX(-60px); }
  to { opacity: 1; transform: translateX(0); }
}

@keyframes riseUp {
  from { opacity: 0; transform: translateY(60px); }
  to { opacity: 1; transform: translateY(0); }
}

/* SCROLL REVEAL */
.reveal {
  opacity: 0;
  transform: translateY(60px);
  transition: 1s;
}

.reveal.show {
  opacity: 1;
  transform: translateY(0);
}

</style>
</head>

<body>

<!-- HERO -->
<section class="hero">
  <div class="hero-left">
    <h1>SAI KANEKAR</h1>
    <p class="desc">IT Graduate & Developer</p>
    <div class="buttons">
      <button class="primary">Email</button>
      <button class="secondary">Call</button>
    </div>
  </div>

  <div class="hero-center">
    <div class="glow"></div>
    <img src="profile.png" class="hero-img">
  </div>

  <div class="hero-right">
    <h2 class="outline">DEVELOPER</h2>
    <h2 class="filled">EDITOR</h2>
  </div>
</section>

<!-- ABOUT -->
<section class="about reveal">
  <h2>About Me</h2>
  <p>
    I am an IT graduate passionate about building web applications and editing engaging videos.
  </p>
</section>

<!-- SKILLS -->
<section class="skills reveal">
  <h2>Skills</h2>
  <div class="skills-grid">
    <div class="skill">HTML</div>
    <div class="skill">CSS</div>
    <div class="skill">JavaScript</div>
    <div class="skill">SQL</div>
  </div>
</section>

<!-- PROJECTS -->
<section class="projects reveal">
  <h2>Projects</h2>
  <div class="projects-grid">
    <div class="project">Portfolio Website</div>
    <div class="project">Database App</div>
    <div class="project">Video Editing</div>
  </div>
</section>

<!-- CONTACT -->
<section class="contact reveal">
  <h2>Contact</h2>
  <form>
    <input type="text" placeholder="Your Name">
    <input type="email" placeholder="Your Email">
    <textarea placeholder="Message"></textarea>
    <button class="primary">Send</button>
  </form>
</section>

<script>

/* PARALLAX */
const hero = document.querySelector(".hero");
const img = document.querySelector(".hero-img");
const glow = document.querySelector(".glow");

hero.addEventListener("mousemove", (e) => {
  const x = (window.innerWidth / 2 - e.clientX) / 25;
  const y = (window.innerHeight / 2 - e.clientY) / 25;

  img.style.transform = `translate(${x}px, ${y}px)`;
  glow.style.transform = `translate(${x*2}px, ${y*2}px)`;
});

/* SCROLL REVEAL */
const observer = new IntersectionObserver((entries)=>{
  entries.forEach(entry=>{
    if(entry.isIntersecting){
      entry.target.classList.add("show");
    }
  });
});

document.querySelectorAll(".reveal").forEach(el=>{
  observer.observe(el);
});

</script>

</body>
</html>
